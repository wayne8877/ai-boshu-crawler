[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-creator-crawler"
version = "0.1.0"
description = "合盛创作者追踪 · 主流媒体平台博主主动监控 + 视频下载 + 语音转录 + 飞书 Base 回写"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Wayne Liu (合盛钮扣厂)", email = "wayne@hs-button.com" },
]
keywords = [
    "creator-economy",
    "video-crawler",
    "transcription",
    "feishu",
    "bilibili",
    "douyin",
    "youtube",
    "macos",
    "apple-silicon",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "tenacity>=8.2",
    "httpx>=0.27",
    "anyio>=4.3",
    # Feishu
    "lark-oapi>=1.2",
    # YouTube
    "yt-dlp>=2024.5",
    # Bilibili
    "bilibili-api-python>=17.0",
    "biliass>=1.4.0",
    # Douyin
    "douyin-tiktok-scraper>=0.5",
    # Media
    "ffmpeg-python>=0.2",
    # ASR
    "openai>=1.30",
    "dashscope>=1.17",
]

[project.optional-dependencies]
mps = [
    # 本地 ASR（MPS 后端，注意 Apple Silicon 兼容性）
    "mlx-whisper>=0.3 ; sys_platform == 'darwin'",
    # OR
    "mlx-audio>=0.2 ; sys_platform == 'darwin'",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "respx>=0.21",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[project.scripts]
hs-crawler = "hs_creator_crawler.bin.hs_crawler:main"

[project.urls]
Homepage = "https://github.com/wayne8877/ai-boshu-crawler"
Repository = "https://github.com/wayne8877/ai-boshu-crawler"
Issues = "https://github.com/wayne8877/ai-boshu-crawler/issues"
Original = "https://github.com/dragon-hh/ai-boshu-crawler"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hs_creator_crawler = ["py.typed", "schemas/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
